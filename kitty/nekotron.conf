## Claude Code tab status (hooks recolor tabs via remote control)
## socket-only: remote control works ONLY over this unix socket, never the tty
allow_remote_control socket-only
listen_on unix:/tmp/kitty-ctl
## Restore Claude Code workspace on every kitty start (crash-proof).
## Refresh the snapshot before intentional quits: kitty-claude-snapshot.sh
startup_session claude-restore.session

## Claude Code animated tab bar (renders ~/.config/kitty/tab_bar.py)
## Revert to stock look: comment out the next line
tab_bar_style custom

