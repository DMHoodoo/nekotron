## ── NEKOTRON 05–08: navigation surgeon + ambient intelligence ──
scrollback_pager_history_size 32
inactive_text_alpha 0.75
mark1_foreground #0a0d18
mark1_background #ff6b7a
mark2_foreground #0a0d18
mark2_background #4cc38a
map cmd+f show_scrollback
map cmd+e kitten hints --type linenum --linenum-action background cursor -g {path}:{line}
map cmd+shift+e kitten hints
map cmd+shift+u kitten hints --type regex --regex [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12} --program @
map cmd+o focus_visible_window
map cmd+m toggle_marker iregex 1 \b(error|failed|failure|fatal|exception)\b 2 \b(passed|success|succeeded)\b
map cmd+shift+x launch --type=tab --cwd=current --stdin-source=@screen_scrollback /Users/hassankhan/Documents/GlowDevelopment/nekotron/kitty/ask-claude.sh
