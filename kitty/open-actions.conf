# Nekotron: clicking a file:// image link in any window pops the image rail
# beside it, seeded with that image (kitty linkifies file:// URLs natively;
# plain click when the app isn't grabbing the mouse, ctrl+shift+click always).
protocol file
ext png,jpg,jpeg,gif,webp
action launch --type=background ${HOME}/bin/img-rail-here ${FILE_PATH}

# any other file:// link: default open
protocol file
action launch --type=background /usr/bin/open ${FILE_PATH}
